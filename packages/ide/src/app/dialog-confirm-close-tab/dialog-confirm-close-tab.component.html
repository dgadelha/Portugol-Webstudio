<header class="dialog-header">
  <h2 id="dialogo-fechar-aba-titulo">Fechar aba</h2>
  <button type="button" class="icon-btn" aria-label="Fechar" appTooltip="Fechar" (click)="dialogRef.close(false)">
    <svg-icon src="assets/mdi/close.svg" aria-hidden="true" />
  </button>
</header>

<div class="dialog-body" id="dialogo-fechar-aba-descricao">
  <p>
    Tem certeza que deseja fechar a aba <strong class="tab-name">{{ data.title }}</strong
    >?
  </p>
  <p class="warning">O {{ data.exercise ? "exercício" : "código" }} que não foi baixado será perdido.</p>
</div>

<footer class="dialog-footer">
  <button type="button" class="btn" (click)="dialogRef.close(false)">Manter aberta</button>
  <button type="button" class="btn btn-primary" cdkFocusInitial (click)="dialogRef.close(true)">Fechar aba</button>
</footer>
