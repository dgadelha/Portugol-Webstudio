<nav class="nav" aria-label="Seções das configurações">
  <h2 class="title" mat-dialog-title>Configurações</h2>

  <div class="sections">
    @for (item of sections; track item.id) {
      <button
        type="button"
        class="section"
        [attr.aria-current]="item.id === section().id ? 'page' : null"
        (click)="sectionId.set(item.id)"
      >
        <svg-icon aria-hidden="true" focusable="false" [src]="item.icon" />
        {{ item.label }}
      </button>
    }
  </div>
</nav>

<div class="main">
  <header class="header">
    <h3>{{ section().label }}</h3>
    <p>{{ section().description }}</p>

    <button class="close" type="button" mat-dialog-close mat-icon-button aria-label="Fechar diálogo">
      <svg-icon src="assets/mdi/close.svg" aria-hidden="true" focusable="false" />
    </button>
  </header>

  <div class="body">
    <ng-container *ngComponentOutlet="section().component" />
  </div>

  <footer class="footer">
    <span class="saved">
      <svg-icon src="assets/mdi/check.svg" aria-hidden="true" focusable="false" />
      <span>Salvo automaticamente</span>
    </span>

    <button type="button" mat-button class="reset" (click)="resetDefaults()">
      <svg-icon src="assets/mdi/restore.svg" aria-hidden="true" focusable="false" matButtonIcon />
      Restaurar padrões
    </button>
  </footer>
</div>
