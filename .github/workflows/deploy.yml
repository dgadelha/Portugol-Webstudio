name: Build and Deploy (Production)
permissions:
  contents: write
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # O GITHUB_TOKEN não entra na lista de exceções das regras da main e da beta; o app entra.
      # Um push feito com o token do app dispara os workflows, diferente do GITHUB_TOKEN.
      - name: Generate app token 🔑
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js 📦
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Date the beta changelog 📅
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node .github/scripts/changelog.mjs release

          if [ -z "$(git status --porcelain -- CHANGELOG.md changelog)" ]; then
            exit 0
          fi

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" --jq .id)+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A -- CHANGELOG.md changelog
          git commit -m "Atualizar data do changelog"
          git push origin HEAD:main

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: npm run build

      - name: Release front-end 🎢
        run: |
          sed -i -e 's/%COMMIT_SHA%/'"${GITHUB_SHA}"'/g' -e 's/%BUILD_DATE%/'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'/g' packages/ide/src/app/version.ts
          ./packages/ide/cleanup-icons.sh
          npm run release

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/ide/dist/browser

      - name: Create Sentry release 📦
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: packages/ide/dist/browser
          inject: false

  sync-beta:
    needs: build-and-deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # O GITHUB_TOKEN não entra na lista de exceções das regras da main e da beta; o app entra.
      # Um push feito com o token do app dispara os workflows, diferente do GITHUB_TOKEN.
      - name: Generate app token 🔑
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main into beta 🔄
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "beta already contains main"
            exit 0
          fi

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" --jq .id)+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:beta
