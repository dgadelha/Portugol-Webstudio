name: Build and Deploy (Production)
permissions:
  contents: write
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Date the beta changelog 📅
        run: |
          node .github/scripts/date-beta-changelog.mjs

          if git diff --quiet CHANGELOG.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualizar data do changelog"
          git push origin HEAD:main

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: npm run build

      - name: Release front-end 🎢
        run: |
          sed -i -e 's/%COMMIT_SHA%/'"${GITHUB_SHA::7}"'/g' packages/ide/src/app/tab-start/tab-start.component.html
          export DATE_NOW_FORMATTED=$(date +'%d/%m/%Y %I:%M:%S %p %Z')
          sed -i -e 's*%DATE%*'"${DATE_NOW_FORMATTED}"'*g' packages/ide/src/app/tab-start/tab-start.component.html
          sed -i -e 's/%SENTRY_RELEASE%/'"${GITHUB_SHA}"'/g' packages/ide/src/main.ts
          ./packages/ide/cleanup-icons.sh
          npm run release

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/ide/dist/browser

      - name: Create Sentry release 📦
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: packages/ide/dist/browser
          inject: false

  sync-beta:
    needs: build-and-deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0

      - name: Merge main into beta 🔄
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "beta already contains main"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:beta
