name: Pull Request CI
permissions:
  contents: read
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: |
          npm run build
          npm run release

      - name: Lint 🚨
        run: npm run lint

      - name: Typecheck 🔍
        run: npm run typecheck

      - name: Format 💅
        run: npm run format:check

  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Java ☕
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 25

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: npm run build

      - name: Cache Portugol Studio JARs ☕
        uses: actions/cache@v6
        with:
          path: packages/runner/tests/assets
          key: portugol-studio-${{ hashFiles('packages/runner/tests/setup.sh') }}

      - name: Download Portugol Studio JARs ☕
        run: npm run test:setup -w @portugol-webstudio/runner

      - name: Run tests 🧪
        run: npm test -- --shard=${{ matrix.shard }}/3
