name: Pull Request CI
permissions:
  contents: read
on: pull_request
jobs:
  lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: |
          npm run build
          npm run release

      - name: Lint 🚨
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: npm run build

      - name: Run tests 🧪
        run: npm test
