name: Pull Request CI
permissions:
  contents: read
on: pull_request
jobs:
  lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: |
          npm run build
          npm run release

      - name: Lint 🚨
        run: npm run lint

  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Java ☕
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 25

      - name: Install dependencies 🔧
        run: npm ci --include=dev

      - name: Build code 🚚
        run: npm run build

      - name: Cache Portugol Console ☕
        uses: actions/cache@v6
        with:
          path: packages/runner/tests/assets
          key: portugol-console-${{ hashFiles('packages/runner/tests/setup.sh') }}

      - name: Run tests 🧪
        run: npm test -- --shard=${{ matrix.shard }}/3
